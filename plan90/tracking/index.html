<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELESFIT - Seguimiento FULL</title>
    <style>
        :root {
            --dark-bg: #121212; --card-bg: #1e1e1e; --text-main: #ffffff;
            --text-dim: #b0b0b0; --accent-red: #ff3e3e; --accent-blue: #3e94ff;
            --accent-gold: #ffd700;
        }
        body { background-color: var(--dark-bg); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .btn-back { color: var(--text-dim); text-decoration: none; font-size: 12px; }
        h1 { color: var(--accent-red); margin: 5px 0; font-size: 24px; }
        .track-section { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 20px; border-top: 3px solid #444; }
        .sec-train { border-top-color: var(--accent-red); }
        .sec-weekly { border-top-color: var(--accent-blue); }
        h2 { font-size: 16px; margin-top: 0; color: #fff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
        input, select, textarea { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 8px; color: white; font-size: 14px; width: 100%; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-red { background: var(--accent-red); color: white; }
        .btn-blue { background: var(--accent-blue); color: white; }
        .history-list { margin-top: 30px; }
        .log-item { background: #1a1a1a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; }
        .log-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        .tag { font-size: 9px; padding: 2px 5px; border-radius: 3px; }
        .tag-train { background: rgba(255,62,62,0.2); color: var(--accent-red); }
        .tag-week { background: rgba(62,148,255,0.2); color: var(--accent-blue); }
        .log-best { color: var(--accent-gold); font-size: 9px; border: 1px solid var(--accent-gold); padding: 1px 4px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="btn-back">← Volver al Plan</a>
        <header><h1>ELESFIT LOGBOOK</h1></header>

        <section class="track-section sec-train">
            <h2>🏋️ Entrenamiento & Fuerza</h2>
            <div class="form-grid">
                <div class="input-group full-width"><label>Grupo</label><select id="group" onchange="loadEx()"><option value="">Seleccionar...</option></select></div>
                <div class="input-group full-width"><label>Ejercicio</label><select id="ex" onchange="updatePrev()"><option value="">Elegir...</option></select></div>
                <div class="input-group"><label>Peso</label><input type="number" step="0.5" id="w"></div>
                <div class="input-group"><label>Reps</label><input type="number" id="r"></div>
            </div>
            <button class="btn-red" onclick="save('train')">REGISTRAR SERIE</button>
            <div id="prev" style="margin-top:10px; font-size:11px; color:var(--accent-red);"></div>
        </section>

        <section class="track-section sec-weekly">
            <h2>📅 Antropometría & Check-in</h2>
            <div class="form-grid">
                <div class="input-group"><label>Peso Corporal</label><input type="number" step="0.1" id="w-p"></div>
                <div class="input-group"><label>Cintura (cm)</label><input type="number" id="w-c"></div>
                <div class="input-group"><label>Cuello (cm)</label><input type="number" id="w-cue"></div>
                <div class="input-group"><label>Pecho (cm)</label><input type="number" id="w-pech"></div>
                <div class="input-group"><label>Brazo (Der)</label><input type="number" id="w-br-d"></div>
                <div class="input-group"><label>Brazo (Izq)</label><input type="number" id="w-br-i"></div>
                <div class="input-group"><label>Muslo (Der)</label><input type="number" id="w-mu-d"></div>
                <div class="input-group"><label>Muslo (Izq)</label><input type="number" id="w-mu-i"></div>
                <div class="input-group"><label>Gemelo (Der)</label><input type="number" id="w-ge-d"></div>
                <div class="input-group"><label>Gemelo (Izq)</label><input type="number" id="w-ge-i"></div>
                <div class="input-group full-width"><label>Foto (Link o archivo)</label><input type="file" id="w-file" accept="image/*"></div>
            </div>
            <button class="btn-blue" onclick="save('week')">GUARDAR MEDIDAS</button>
        </section>

        <div id="history" class="history-list"></div>
    </div>

    <script src="../../app/tracking/exercises_db.js"></script>
    <script>
        const gs=document.getElementById('group'), es=document.getElementById('ex'), hDiv=document.getElementById('history'), pDiv=document.getElementById('prev');
        let logs=JSON.parse(localStorage.getItem('plan90_logs')||'[]');

        if(typeof EXERCISES_DB!=='undefined'){Object.keys(EXERCISES_DB).forEach(g=>{let o=document.createElement('option');o.value=g;o.innerText=g;gs.appendChild(o);});}
        function loadEx(){es.innerHTML='<option value="">Elegir...</option>';if(gs.value)EXERCISES_DB[gs.value].forEach(e=>{let o=document.createElement('option');o.value=e;o.innerText=e;es.appendChild(o);});updatePrev();}
        function save(t){
            let l={id:Date.now(),type:t,date:new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})};
            if(t==='train'){
                l.title=es.value; let p=parseFloat(document.getElementById('w').value), r=parseInt(document.getElementById('r').value);
                if(!l.title||!p||!r)return alert('Faltan datos');
                l.data=`${p}kg x ${r}`; l.wVal=p; fin(l);
            } else {
                l.title="Check-in Antropometría"; 
                const pBody = document.getElementById('w-p').value;
                const cintura = document.getElementById('w-c').value;
                l.data=`Peso: ${pBody}kg | Cint: ${cintura}cm`;
                l.note=`Brazos: ${document.getElementById('w-br-d').value}/${document.getElementById('w-br-i').value} | Muslos: ${document.getElementById('w-mu-d').value}/${document.getElementById('w-mu-i').value} | Gemelos: ${document.getElementById('w-ge-d').value}/${document.getElementById('w-ge-i').value}`;
                let fi=document.getElementById('w-file'); if(fi.files[0]){let rd=new FileReader(); rd.onload=(e)=>{l.img=e.target.result;fin(l);};rd.readAsDataURL(fi.files[0]);}else{fin(l);}
            }
        }
        function fin(l){logs.unshift(l);localStorage.setItem('plan90_logs',JSON.stringify(logs));loadH();updatePrev();}
        function loadH(){
            hDiv.innerHTML=logs.map(l=>{
                let rTag=""; if(l.type==='train'){let b=Math.max(...logs.filter(h=>h.type==='train'&&h.title===l.title).map(h=>h.wVal||0));if(l.wVal===b)rTag='<span class="log-best">★ RÉCORD</span>';}
                return `<div class="log-item"><div class="log-header"><span>${l.title}</span><span class="tag tag-${l.type}">${l.type}</span></div><div style="color:white;font-size:14px;">${l.data}</div><div style="color:#888;font-size:11px;">${l.note||""}</div>${rTag}${l.img?`<img src="${l.img}" style="width:100%;border-radius:4px;margin-top:8px;">`:''}<div style="font-size:9px;color:#444;margin-top:5px;">${l.date}</div></div>`;
            }).join('');
        }
        function updatePrev(){if(!es.value){pDiv.innerHTML='';return;}let f=logs.filter(l=>l.type==='train'&&l.title===es.value).slice(0,2);pDiv.innerHTML=f.map(l=>`• ${l.date}: ${l.data}`).join('<br>');}
        window.onload=loadH;
    </script>
</body>
</html>
