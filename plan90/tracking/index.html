<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELESFIT - Seguimiento PRO</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --accent-red: #ff3e3e;
            --accent-blue: #3e94ff;
            --accent-green: #3eff8b;
            --accent-gold: #ffd700;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-bottom: 50px;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 { font-weight: 900; letter-spacing: -1px; color: var(--accent-red); margin: 0; }

        .track-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border-top: 4px solid #444;
        }

        /* Colores por sección */
        .sec-train { border-top-color: var(--accent-red); }
        .sec-weekly { border-top-color: var(--accent-blue); }
        .sec-monthly { border-top-color: var(--accent-gold); }

        h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .sec-train h2 { color: var(--accent-red); }
        .sec-weekly h2 { color: var(--accent-blue); }
        .sec-monthly h2 { color: var(--accent-gold); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: var(--text-dim); font-weight: bold; text-transform: uppercase; }

        input, select, textarea {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }

        input:focus { border-color: var(--accent-red); outline: none; }

        .full-width { grid-column: span 2; }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn-red { background: var(--accent-red); color: white; }
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-gold { background: var(--accent-gold); color: black; }

        .history-list { margin-top: 40px; }
        .log-item {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #444;
            font-size: 13px;
        }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .tag-train { background: rgba(255, 62, 62, 0.2); color: var(--accent-red); }
        .tag-week { background: rgba(62, 148, 255, 0.2); color: var(--accent-blue); }
        .tag-month { background: rgba(255, 215, 0, 0.2); color: var(--accent-gold); }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="btn-back">← Volver al Plan</a>
        
        <header>
            <h1>ELESFIT LOGBOOK</h1>
            <p style="color: var(--text-dim); font-size: 14px;">Mide lo que importa, conquista tu meta</p>
        </header>

        <!-- SECCIÓN ENTRENAMIENTO -->
        <section class="track-section sec-train">
            <h2>🏋️ Entrenamiento Diario</h2>
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Ejercicio</label>
                    <input type="text" id="t-ejercicio" placeholder="Ej: Hack Squat">
                </div>
                <div class="input-group">
                    <label>Peso (kg)</label>
                    <input type="number" id="t-peso" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Reps</label>
                    <input type="number" id="t-reps" placeholder="0">
                </div>
                <div class="input-group full-width">
                    <label>Progreso</label>
                    <select id="t-progreso">
                        <option value="Igual">Igual que antes</option>
                        <option value="Mejor">🔥 ¡Hubo Mejora!</option>
                        <option value="Bajo">Bajo rendimiento</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label>Comentario</label>
                    <textarea id="t-nota" rows="2" placeholder="Sensaciones, dolor, pump..."></textarea>
                </div>
            </div>
            <button class="btn-red" onclick="saveLog('train')">GUARDAR SESIÓN</button>
        </section>

        <!-- SECCIÓN SEMANAL -->
        <section class="track-section sec-weekly">
            <h2>📅 Check-in Semanal</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>Peso Ayunas</label>
                    <input type="number" step="0.1" id="w-peso" placeholder="0.0">
                </div>
                <div class="input-group">
                    <label>Sueño (Prom.)</label>
                    <input type="number" id="w-sueno" placeholder="Hs">
                </div>
                <div class="input-group">
                    <label>Hombros (cm)</label>
                    <input type="number" id="w-hombros" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Pecho (cm)</label>
                    <input type="number" id="w-pecho" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Cintura (cm)</label>
                    <input type="number" id="w-cintura" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Brazo (cm)</label>
                    <input type="number" id="w-brazo" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Muslo (cm)</label>
                    <input type="number" id="w-muslo" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Gemelo (cm)</label>
                    <input type="number" id="w-gemelo" placeholder="0">
                </div>
                <div class="input-group full-width">
                    <label>Cardio / Pasos</label>
                    <input type="text" id="w-cardio" placeholder="Ej: 30m / 10k">
                </div>
                <div class="input-group full-width">
                    <label>Fotos (Links)</label>
                    <input type="text" id="w-fotos" placeholder="Ej: Link a Google Drive o iCloud">
                </div>
            </div>
            <button class="btn-blue" onclick="saveLog('week')">GUARDAR SEMANA</button>
        </section>

        <!-- SECCIÓN MENSUAL -->
        <section class="track-section sec-monthly">
            <h2>🏆 Auditoría Mensual</h2>
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Decisión Nutricional</label>
                    <select id="m-decision">
                        <option value="Mantener">Mantener Calorías</option>
                        <option value="Subir">Subir (Superávit)</option>
                        <option value="Bajar">Bajar (Ajuste)</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label>Resumen del Mes</label>
                    <textarea id="m-resumen" rows="3" placeholder="Logros, fotos subidas, ajustes..."></textarea>
                </div>
            </div>
            <button class="btn-gold" onclick="saveLog('month')">CERRAR MES</button>
        </section>

        <div class="history-list" id="history">
            <!-- Los logs aparecerán aquí -->
        </div>

        <button style="background: transparent; color: #555; font-size: 12px; margin-top: 50px;" onclick="clearLogs()">Borrar Historial</button>
    </div>

    <script>
        function saveLog(type) {
            let log = {
                id: Date.now(),
                type: type,
                date: new Date().toLocaleDateString('es-AR'),
            };

            if(type === 'train') {
                log.title = document.getElementById('t-ejercicio').value;
                log.data = `${document.getElementById('t-peso').value}kg x ${document.getElementById('t-reps').value} (${document.getElementById('t-progreso').value})`;
                log.note = document.getElementById('t-nota').value;
                if(!log.title) return alert('Escribe el ejercicio');
            } else if(type === 'week') {
                log.title = "Check-in Semanal";
                log.data = `Peso: ${document.getElementById('w-peso').value}kg | Sueño: ${document.getElementById('w-sueno').value}hs`;
                log.note = `Hombros: ${document.getElementById('w-hombros').value}cm · Pecho: ${document.getElementById('w-pecho').value}cm · Cintura: ${document.getElementById('w-cintura').value}cm · Brazo: ${document.getElementById('w-brazo').value}cm · Muslo: ${document.getElementById('w-muslo').value}cm · Gemelo: ${document.getElementById('w-gemelo').value}cm · Cardio/Pasos: ${document.getElementById('w-cardio').value} · Fotos: ${document.getElementById('w-fotos').value}`;
            } else if(type === 'month') {
                log.title = "Auditoría Mensual";
                log.data = `Decisión: ${document.getElementById('m-decision').value}`;
                log.note = document.getElementById('m-resumen').value;
            }

            let logs = JSON.parse(localStorage.getItem('elesfit_logs') || '[]');
            logs.unshift(log);
            localStorage.setItem('elesfit_logs', JSON.stringify(logs));
            
            // Limpiar inputs
            if(type === 'train') {
                document.getElementById('t-ejercicio').value = '';
                document.getElementById('t-peso').value = '';
                document.getElementById('t-reps').value = '';
                document.getElementById('t-nota').value = '';
            }

            loadHistory();
        }

        function loadHistory() {
            let logs = JSON.parse(localStorage.getItem('elesfit_logs') || '[]');
            let container = document.getElementById('history');
            
            container.innerHTML = logs.map(l => `
                <div class="log-item" style="border-left-color: ${l.type === 'train' ? 'var(--accent-red)' : (l.type === 'week' ? 'var(--accent-blue)' : 'var(--accent-gold)')}">
                    <div class="log-header">
                        <span>${l.title}</span>
                        <span class="tag ${l.type === 'train' ? 'tag-train' : (l.type === 'week' ? 'tag-week' : 'tag-month')}">${l.type}</span>
                    </div>
                    <div style="color: white; margin-bottom: 5px;">${l.data}</div>
                    <div style="color: var(--text-dim); font-style: italic;">${l.note}</div>
                    <div style="font-size: 10px; color: #444; margin-top: 10px;">${l.date}</div>
                </div>
            `).join('');
        }

        function clearLogs() {
            if(confirm('¿Borrar todo el historial?')) {
                localStorage.removeItem('elesfit_logs');
                location.reload();
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
