<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>LOGBOOK PRO</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px}select,input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:12px;margin-bottom:10px;border-radius:8px;box-sizing:border-box}button{width:100%;padding:15px;background:#ff3e3e;color:#fff;border:none;border-radius:8px;font-weight:bold}.item{border-left:4px solid #ff3e3e;background:#111;padding:15px;margin-top:10px}</style></head><body><h3>LOGBOOK PRO</h3><select id='g' onchange='u()'><option value=''>Grupo...</option><option value='p'>Pecho</option><option value='e'>Espalda</option><option value='l'>Piernas</option></select><select id='ex'><option>Ejercicio...</option></select><input type='number' id='w' placeholder='Peso (kg)'><input type='number' id='r' placeholder='Reps'><select id='rir'><option>RIR 0</option><option>RIR 1</option><option>Rest-Pause</option><option>Dropset</option></select><button onclick='s()'>GUARDAR SERIE</button><div id='h'></div><script>const d={p:['Press Plano','Press Inclinado','Peck Deck'],e:['Remo T','Jalón'],l:['Hack','Prensa']};function u(){const g=document.getElementById('g').value;document.getElementById('ex').innerHTML=d[g].map(x=>'<option value="'+x+'">'+x+'</option>').join('');}function s(){const res='<b>'+document.getElementById('ex').value+'</b>: '+document.getElementById('w').value+'kg x '+document.getElementById('r').value+' ('+document.getElementById('rir').value+')';document.getElementById('h').innerHTML='<div class="item">'+res+'</div>'+document.getElementById('h').innerHTML;}</script></body></html>
