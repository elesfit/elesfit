<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>LOGBOOK PRO</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:15px}.card{background:#111;padding:20px;border-radius:12px;border:1px solid #222}label{display:block;color:#888;font-size:10px;margin-bottom:5px;text-transform:uppercase}select,input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:12px;margin-bottom:10px;border-radius:8px;box-sizing:border-box}button{width:100%;padding:15px;background:#ff3e3e;color:#fff;border:none;border-radius:8px;font-weight:bold}.item{border-left:4px solid #ff3e3e;background:#111;padding:15px;margin-top:10px;border-radius:4px}</style></head><body><div class='card'><h2>LOGBOOK PRO</h2><label>Grupo</label><select id='g' onchange='u()'><option value=''>Seleccionar...</option></select><label>Ejercicio</label><select id='ex'></select><div style='display:grid;grid-template-columns:1fr 1fr;gap:10px'><div><label>Peso</label><input type='number' id='w'></div><div><label>Reps</label><input type='number' id='r'></div></div><label>RIR</label><select id='rir'><option>RIR 0</option><option>RIR 1</option><option>Rest-Pause</option><option>Dropset</option></select><button onclick='s()'>GUARDAR SERIE</button></div><div id='h'></div><script src='exercises_db.js'></script><script>const gs=document.getElementById('g');Object.keys(EXERCISES_DB).forEach(g=>{let o=document.createElement('option');o.value=g;o.innerText=g;gs.appendChild(o)});function u(){const g=gs.value;const e=document.getElementById('ex');e.innerHTML=EXERCISES_DB[g].map(x=>'<option value="'+x+'">'+x+'</option>').join('');}function s(){const ex=document.getElementById('ex').value;const w=document.getElementById('w').value;const r=document.getElementById('r').value;if(!ex||!w||!r)return alert('Faltan datos');const html='<div class="item"><b>'+ex+'</b><br>'+w+'kg x '+r+' - '+document.getElementById('rir').value+'</div>';document.getElementById('h').innerHTML=html+document.getElementById('h').innerHTML;}</script></body></html>
